# OpenRouter local profile.
#
# This uses the OpenRouter adapter through the OpenAI-compatible chat
# completions transport. It is a local configuration template only; copying it
# is not live evidence and does not set live_certified=true. To generate
# bounded provider preflight evidence, run:
#   ./scripts/provider-live-certification-run.sh --live [config_path] [evidence_root]
# A passing preflight is not provider quality, SLA/gateway, release, or
# production-readiness certification. This file must not contain a real API key
# in git.
# Before running doctor/serve with this profile, set:
#   AGENT_LLM_MM_OPENROUTER_API_KEY

transport = "stdio"
database_url = "sqlite:///absolute/path/to/openrouter/agent-llm-mm.sqlite"

[model]
provider = "openrouter"

[model.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "AGENT_LLM_MM_OPENROUTER_API_KEY"
model = "openrouter/auto"
timeout_ms = 30000

[dashboard]
enabled = false
host = "127.0.0.1"
port = 8787
base_path = "/"
event_capacity = 2000
sse_enabled = true
open_browser = false
required = false

[daemon]
enabled = false
poll_interval_ms = 60000
max_concurrent_tasks = 1
