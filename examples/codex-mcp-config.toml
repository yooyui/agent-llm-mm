# Example snippet for .codex/config.toml
#
# First create a local config with `./scripts/agent-llm-mm.sh bootstrap-local`.
# If you pass a target path from another working directory, prefer an absolute path;
# relative bootstrap-local targets are repository-root relative.
# or by manually copying an example profile, then point AGENT_LLM_MM_CONFIG at it.
# For OpenRouter, copy examples/agent-llm-mm.openrouter.example.toml to a local
# config file, set AGENT_LLM_MM_OPENROUTER_API_KEY in your shell or Codex env,
# and point AGENT_LLM_MM_CONFIG below at that local OpenRouter config.
# This MCP config snippet is not live evidence; run
# ./scripts/provider-live-certification-run.sh --live [config_path] [evidence_root]
# when you need bounded provider preflight evidence.

# macOS native shell entrypoint:
[mcp_servers.agent-llm-mm]
command = "/absolute/path/agent-llm-mm/scripts/agent-llm-mm.sh"
args = ["serve"]
env = { AGENT_LLM_MM_CONFIG = "/absolute/path/agent-llm-mm/agent-llm-mm.local.toml" }
transport = "stdio"

# If you prefer no wrapper script, use:
# [mcp_servers.agent-llm-mm-cargo]
# command = "cargo"
# args = ["run", "--quiet", "--bin", "agent_llm_mm", "--", "serve"]
# transport = "stdio"
# env = { AGENT_LLM_MM_CONFIG = "/absolute/path/agent-llm-mm/agent-llm-mm.local.toml" }
