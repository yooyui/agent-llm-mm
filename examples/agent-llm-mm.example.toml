# General entry config for `agent_llm_mm`.
#
# Pick the profile that matches the data you are about to touch:
# - examples/agent-llm-mm.dev.example.toml: local development and tests
# - examples/agent-llm-mm.prod-local.example.toml: formal local data
# - examples/agent-llm-mm.demo.example.toml: deterministic self-revision demo
# - examples/agent-llm-mm.openrouter.example.toml: OpenRouter via OpenAI-compatible transport
#
# `bootstrap-local` copies the dev example as the safest first-run template.
# Relative bootstrap-local targets are resolved from the repository root.
# It does not create secrets, overwrite local config, run doctor, or start serve.
#
# Do not reuse one database_url for formal data, manual tests, and demos.

transport = "stdio"
database_url = "sqlite:///absolute/path/to/agent-llm-mm.local.sqlite"

[model]
provider = "mock"

# OpenRouter is an optional supported provider profile. Prefer copying
# examples/agent-llm-mm.openrouter.example.toml instead of mixing provider
# profiles in one config. Keep secrets in AGENT_LLM_MM_OPENROUTER_API_KEY.
#
# [model]
# provider = "openrouter"
#
# [model.openrouter]
# model = "openai/gpt-oss-120b"
# api_key_env = "AGENT_LLM_MM_OPENROUTER_API_KEY"

[dashboard]
enabled = false
host = "127.0.0.1"
port = 8787
base_path = "/"
event_capacity = 2000
sse_enabled = true
open_browser = false
required = false

[daemon]
enabled = false
poll_interval_ms = 60000
max_concurrent_tasks = 1
